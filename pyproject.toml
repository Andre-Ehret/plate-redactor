[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plate-redactor"
version = "0.0.0"
description = "On-device licence-plate detector for privacy redaction, trained synthetic-first."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [{ name = "plate-redactor contributors" }]
keywords = ["license-plate", "object-detection", "privacy", "gdpr", "tflite", "on-device"]

# Baseline deps for the synthetic data generator (Phase 1).
# Training / TFLite-export deps are added in later phases to keep the base
# install light and portable (see README "Build phases").
dependencies = [
    "numpy>=1.24",
    "pillow>=10.1",
    "opencv-python>=4.8",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
# Phase 2 — training. Kept out of the base install: ultralytics pulls torch,
# which is large and platform-specific. Install with: pip install -e ".[train]"
train = [
    "ultralytics>=8.1",
]

[project.scripts]
plate-redactor-generate = "plate_redactor.generator.generate:main"

[project.urls]
Homepage = "https://github.com/andrenalin/plate-redactor"

[tool.setuptools.packages.find]
where = ["src"]
