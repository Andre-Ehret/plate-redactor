[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plate-redactor"
version = "0.0.0"
description = "On-device licence-plate detector for privacy redaction, trained synthetic-first."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [{ name = "plate-redactor contributors" }]
keywords = ["license-plate", "object-detection", "privacy", "gdpr", "tflite", "on-device"]

# Baseline deps for the synthetic data generator (Phase 1).
# Training / TFLite-export deps are added in later phases to keep the base
# install light and portable (see README "Build phases").
dependencies = [
    "numpy>=1.24",
    "pillow>=10.1",
    "opencv-python>=4.8",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
# Phase 2 — training. Kept out of the base install: ultralytics pulls torch,
# which is large and platform-specific. Install with: pip install -e ".[train]"
train = [
    "ultralytics>=8.1",
]
# Phase 3 — evaluation. Needs the model (ultralytics) plus matplotlib for the
# threshold-sweep plot. Install with: pip install -e ".[eval]"
eval = [
    "ultralytics>=8.1",
    "matplotlib>=3.5",
]
# Phase 4 — TFLite export. ultralytics drives the export; tensorflow provides the
# TFLite runtime + converter (and the raw interpreter the verify/benchmark scripts
# use — the same surface as the app's react-native-fast-tflite). Install with:
# pip install -e ".[export]"
export = [
    "ultralytics>=8.1",
    "tensorflow>=2.13",
]
# Phase 5 — integration contract test. Only a lightweight TFLite runtime is needed
# (no ultralytics/torch) — the same raw interpreter surface the app uses. Install
# with: pip install -e ".[dev,contract]"
contract = [
    "ai-edge-litert>=1.0",
]

[project.scripts]
plate-redactor-generate = "plate_redactor.generator.generate:main"

[project.urls]
Homepage = "https://github.com/andrenalin/plate-redactor"

[tool.setuptools.packages.find]
where = ["src"]
